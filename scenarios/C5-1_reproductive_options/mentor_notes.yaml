key_facts:
  C1:
    card: reproductive-options
    point: 2
    text: Different options are appropriate for different people. [s35]
  C2:
    card: reproductive-options
    point: 1
    text: 'The options: natural conception without testing; IVF with preimplantation genetic testing for a monogenic condition (PGT-M, formerly called PGD); prenatal testing by chorionic villus sampling or amniocentesis; donor sperm (or donor egg); adoption; surrogacy; choosing not to have children. [s35]'
  C3:
    card: options-in-detail
    point: 0
    text: 'Natural conception: each pregnancy has a 50% chance of inheriting the HD gene expansion. [s19]'
  C4:
    card: options-in-detail
    point: 2
    text: 'PGT-M: IVF with fertility drugs; embryos are tested and only embryos without the expansion are transferred. It is done at specialised centres and is usually not covered by insurance or government funding. [s35]'
  C5:
    card: options-in-detail
    point: 5
    text: 'Prenatal testing: chorionic villus sampling at about 11-12 weeks, or amniocentesis after 15 weeks; the purpose is to allow the couple to consider ending the pregnancy if the expansion is found. [s35]'
  C6:
    card: non-directive-counselling
    point: 0
    text: The genetic counsellor discusses each option without bias, so the couple can make the decision that is right for them. [s35]
  C7:
    card: non-directive-counselling
    point: 0
    text: The genetic counsellor discusses each option without bias, so the couple can make the decision that is right for them. [s35]
  C8:
    card: non-directive-counselling
    point: 3
    text: Offer written information, time, and follow-up; refer to an IVF centre, donor programmes or adoption services if the couple wishes. [?]
