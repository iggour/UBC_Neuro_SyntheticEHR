# Scenario C4-1: mentor checkpoints (hybrid mentor)
# The AI judge only answers "met / not met" for each checkpoint after each trainee turn.
# All hint and feedback text below is pre-written; the AI never writes its own advice.
# Drafted by: Claude (Anthropic), 2026-10-29. Reviewed by: PENDING (project clinician)
#
# Sources (Case 4; s36-s39 are new and need human verification).
# Reused, defined elsewhere (not redefined here):
#   s12 (scenarios/s3_suicide_risk_assessment): Dazzi T et al. Does asking about suicide and related behaviours induce
#         suicidal ideation? Psychol Med 2014;44(16):3361-3. https://pubmed.ncbi.nlm.nih.gov/24998511/
#   s19 (scenarios/A1_disclosing_jhd_diagnosis, draft): Huntington Society of Canada, What is HD? fact sheet.
#         https://hsc.huntingtonsociety.ca/public/factsheet/what-is-hd.pdf
#   s35 (scenarios/B1_late_onset_diagnosis, draft): HSC Physician's Guide, chapters 2, 3, 3a and 8.
#         https://hsc.huntingtonsociety.ca/public/resources/physicians-guide.pdf
# New:
#   s36 = Huntington Society of Canada. A Physician's Guide to the Management of Huntington Disease, 3rd ed.,
#         chapters 1 (overview and principles), 5 (the cognitive disorder: unawareness, irritability, work) and
#         6 (the psychiatric disorder). https://hsc.huntingtonsociety.ca/public/resources/physicians-guide.pdf
#         Status: chapters read by Claude 2026-10-29; needs human verification.

hint_timing: Show a checkpoint's hint if it is still not met after `hint_after_turn` trainee turns.

checkpoints:
  - id: C1
    name: Start with Mark, then hear Anna with his agreement
    met_if: Trainee asks Mark first what has been happening, then asks his permission to hear Anna's view or to see each of them alone briefly.
    hint_after_turn: 3
    hint: "Mark says it's just stress, and Anna has a list. How can you hear both without taking sides?"
    feedback_met: "You started with Mark and heard Anna with his agreement."
    feedback_missed: "Start with the patient, then ask permission to hear the partner. People with HD may not notice their own changes, and families may need to speak privately."
    unlocks: H2_anna_frightened
    knowledge_card: behavioural-onset
    source: [s36]
  - id: C2
    name: Explore work, mood, sleep and alcohol
    met_if: Trainee asks open, non-judgemental questions about work, irritability, mood, sleep, and specific questions about alcohol.
    hint_after_turn: 5
    hint: "What has actually happened at work? And what is 'a couple of beers'?"
    feedback_met: "You explored work and alcohol without judgement, which uncovered the warning at work and heavier drinking."
    feedback_missed: "Ask specifically about work, mood, sleep and alcohol. Each matters for both the cause and the plan."
    unlocks: H1_written_warning
    knowledge_card: behavioural-onset
    source: [s36]
  - id: C3
    name: Think broadly about causes
    met_if: Trainee considers a range of causes (for example depression, alcohol, thyroid or other medical causes, a neurological condition) and plans basic investigations, rather than settling on 'stress' or jumping to one diagnosis.
    hint_after_turn: 7
    hint: "Stress, depression, alcohol, something neurological? What else could explain all of this?"
    feedback_met: "You kept a broad view of possible causes and planned basic checks."
    feedback_missed: "Irritability and work problems have many causes. Keep a broad differential and plan basic investigations."
    knowledge_card: behavioural-onset
    source: [s36, s35]
  - id: C4
    name: Notice and examine the movements
    met_if: Trainee asks specifically about clumsiness or the hands, and examines for involuntary movements, describing what they see neutrally.
    hint_after_turn: 8
    hint: "Watch his fingers and shoulders while he talks. Has anyone asked about his hands?"
    feedback_met: "You noticed the movements, examined calmly, and Mark admitted his hands had been 'doing their own thing'."
    feedback_missed: "People with HD are often unaware of mild involuntary movements. Look for them and ask specifically."
    unlocks: H3_hands
    knowledge_card: unknown-family-history
    source: [s36]
  - id: C5
    name: Raise a possible neurological cause, including HD
    met_if: Trainee explains honestly that the combination of changes could have a neurological cause, names HD as one possibility that needs checking, and explains that being adopted means family history cannot rule it out, without presenting it as certain.
    hint_after_turn: 10
    hint: "He doesn't know his birth family. Does that make HD less likely, or just less visible?"
    feedback_met: "You raised HD honestly as one possibility and explained why an unknown family history does not rule it out."
    feedback_missed: "An unknown family history (for example after adoption) is a recognised reason HD is missed. Raise it as a possibility, honestly and without alarm."
    knowledge_card: unknown-family-history
    source: [s35, s36]
  - id: C6
    name: Consent for referral and explain diagnostic testing
    met_if: Trainee asks Mark's consent to refer to neurology or an HD/genetics clinic, and explains that a diagnostic genetic test would be offered there with counselling, only with his agreement, and could have implications for Chloe.
    hint_after_turn: 12
    hint: "What would happen next, and what would Mark be agreeing to?"
    feedback_met: "You gained Mark's consent for referral and explained what a diagnostic test would involve."
    feedback_missed: "Explain the referral and that any genetic test would need counselling and his agreement; mention it may matter for his daughter."
    knowledge_card: unknown-family-history
    source: [s35, s19]
  - id: C7
    name: Check safety
    met_if: Trainee asks Mark kindly about mood and thoughts of harming himself or others, asks whether there are firearms at home and how they are stored, and checks Anna's safety when seeing her alone.
    hint_after_turn: 12
    hint: "Irritability, drinking and a job at risk. Have you asked about safety, including weapons at home?"
    feedback_met: "You checked mood, suicidal thoughts, aggression and firearms, and asked Anna about her safety."
    feedback_missed: "Irritability in HD can lead to outbursts, and suicide risk is raised. Ask directly about safety and firearms."
    knowledge_card: behavioural-onset
    source: [s12, s36]
  - id: C8
    name: Follow-up and interim advice
    met_if: Trainee arranges early follow-up, basic tests, advice about alcohol, and suggests Mark avoids major work or financial decisions until assessed; gives a contact if things escalate at home.
    hint_after_turn: 13
    hint: "What happens between today and the neurology appointment?"
    feedback_met: "You made an interim plan and arranged follow-up."
    feedback_missed: "Agree interim steps: tests, alcohol, avoiding big decisions, who to call if things escalate, and early follow-up."
    knowledge_card: behavioural-onset
    source: [s36]

red_flags:
  - id: R1
    name: Dismisses it as stress
    met_if: Trainee attributes everything to stress or personality and ends the visit without examining or planning follow-up.
    feedback: "Early HD often starts with behavioural and cognitive changes that look like stress. Keep an open mind and examine."
    source: s36
  - id: R2
    name: Announces HD as certain
    met_if: Trainee tells Mark he has Huntington disease, or a 'brain disease', as a fact at this visit.
    feedback: "Raise HD as one possibility needing assessment; the diagnosis is made after examination and, if he agrees, testing."
    source: [s35, s36]
  - id: R3
    name: Orders a genetic test without consent
    met_if: Trainee orders or suggests ordering an HD gene test today without explanation, counselling or Mark's agreement.
    feedback: "Diagnostic genetic testing needs explanation, counselling and consent, and has implications for relatives."
    source: s35
  - id: R4
    name: Talks about Mark, not with him
    met_if: Trainee mainly discusses Mark with Anna in the third person while he is present.
    feedback: "Speak with Mark directly; ask his permission before hearing Anna's account."
    source: s36
  - id: R5
    name: Skips safety
    met_if: Trainee never asks about suicidal thoughts, aggression at home or firearms.
    feedback: "Irritability, drinking and job stress make safety questions essential, including about firearms."
    source: [s12, s36]
  - id: R6
    name: Blames or lectures
    met_if: Trainee scolds Mark about his temper or drinking, or calls him difficult.
    feedback: "Irritability may be a symptom. Lecturing makes people disengage."
    source: s36
