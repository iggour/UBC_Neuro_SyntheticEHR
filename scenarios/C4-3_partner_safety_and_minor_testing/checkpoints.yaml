# Scenario C4-3: mentor checkpoints (hybrid mentor)
# The AI judge only answers "met / not met" for each checkpoint after each trainee turn.
# All hint and feedback text below is pre-written; the AI never writes its own advice.
# Drafted by: Claude (Anthropic), 2026-10-29. Reviewed by: PENDING (project clinician)
#
# Sources (Case 4; s36-s39 are new and need human verification).
# Reused, defined elsewhere (not redefined here):
#   s6 (scenarios/s1_pretest_counselling): MacLeod R et al. Recommendations for the predictive genetic test in HD.
#         Clin Genet 2013;83(3):221-31. https://pubmed.ncbi.nlm.nih.gov/22642570/
#   s12 (scenarios/s3_suicide_risk_assessment): Dazzi T et al. Psychol Med 2014;44(16):3361-3. https://pubmed.ncbi.nlm.nih.gov/24998511/
#   s21 (scenarios/A1_disclosing_jhd_diagnosis, draft): Canadian Paediatric Society. Genetic testing and screening in
#         children. 2022. https://cps.ca/en/documents/position/genetic-testing
#   s35 (scenarios/B1_late_onset_diagnosis, draft): HSC Physician's Guide, chapters 2, 3, 3a and 8.
#         https://hsc.huntingtonsociety.ca/public/resources/physicians-guide.pdf
#   s36 (scenarios/C4-1_recognising_possible_hd, draft): HSC Physician's Guide, chapters 1, 5 and 6.
#         https://hsc.huntingtonsociety.ca/public/resources/physicians-guide.pdf
# New:
#   s37 = World Health Organization. Health care for women subjected to intimate partner violence or sexual violence:
#         a clinical handbook (WHO/RHR/14.26). 2014. https://www.who.int/publications/i/item/WHO-RHR-14.26
#         Status: summary and LIVES approach checked by Claude 2026-10-29; handbook text needs human verification.
#   s38 = VictimLinkBC (Government of British Columbia), 24-hour multilingual help line for victims of family and
#         sexual violence: call or text 1-800-563-0808. https://victimlinkbc.ca/
#         Status: page and number checked by Claude 2026-10-29; needs human verification.

hint_timing: Show a checkpoint's hint if it is still not met after `hint_after_turn` trainee turns.

checkpoints:
  - id: C1
    name: Confidentiality and listening
    met_if: Trainee explains what will stay confidential (including that Mark will not be told she came without her agreement) and its limits, and listens without judgement.
    hint_after_turn: 2
    hint: "Anna is afraid Mark will find out. What can you promise, and what can't you?"
    feedback_met: "You were clear about confidentiality and its limits, and Anna felt safe to talk."
    feedback_missed: "Explain what stays private and its limits before she shares more."
    knowledge_card: safety-at-home
    source: s37
  - id: C2
    name: Validate, then ask directly about safety
    met_if: Trainee validates her experience and then asks directly and kindly whether Mark has hurt her, threatened her, or made her afraid.
    hint_after_turn: 4
    hint: "Anna mentions 'the shouting'. Have you asked whether it has gone further?"
    feedback_met: "You validated Anna and asked directly about violence and fear, and she told you what happened."
    feedback_missed: "Ask directly and kindly about violence and fear. People rarely volunteer it."
    unlocks: H1_grabbed
    knowledge_card: safety-at-home
    source: [s37, s36]
  - id: C3
    name: Assess immediate risk, including firearms and Mark's statement
    met_if: Trainee asks about escalation, firearms in the house, threats, and anything Mark has said about not wanting to live, and treats a possible suicidal statement seriously.
    hint_after_turn: 6
    hint: "There was a rifle in the clinic notes. Where is it now? Has Mark said anything worrying about himself?"
    feedback_met: "You asked about the rifle and Mark's statement, which raised the level of risk."
    feedback_missed: "Ask about firearms and threats, and about anything the person with HD has said about not wanting to live."
    unlocks: H2_rifle_back
    knowledge_card: safety-at-home
    source: [s36, s12, s37]
  - id: C4
    name: Make a safety plan with her
    met_if: Trainee works with Anna on a plan (warning signs, an exit strategy, a place to go, getting the rifle out of the house, crisis numbers 911 and VictimLinkBC), respecting her choices rather than telling her what she must do.
    hint_after_turn: 8
    hint: "What will Anna do tonight if an argument starts? Where could she and Chloe go?"
    feedback_met: "You made a safety plan with Anna that she could actually use."
    feedback_missed: "Agree practical steps: an exit plan, a place to go, firearm removal and crisis contacts. Let her choose."
    knowledge_card: safety-at-home
    source: [s36, s37, s38]
  - id: C5
    name: Explain irritability without excusing violence
    met_if: Trainee explains that irritability and outbursts can be part of HD and can be treated, that this does not make violence acceptable, and that her safety comes first; with her agreement, arranges an urgent review of Mark's care (including his mental state) through his team.
    hint_after_turn: 9
    hint: "Anna asks whether it is the HD or anger at her. What is true, and what still matters?"
    feedback_met: "You explained irritability as a symptom without excusing violence, and arranged urgent review of Mark's care."
    feedback_missed: "Irritability can be an HD symptom and can be treated, but safety comes first. Arrange urgent review of Mark's care, with Anna's agreement on how."
    knowledge_card: irritability-and-carers
    source: s36
  - id: C6
    name: Ask how Anna is coping, and offer support
    met_if: Trainee asks how Anna herself is coping, acknowledges her exhaustion and mixed feelings without judgement, and offers carer support (counselling, the Huntington Society of Canada, respite).
    hint_after_turn: 10
    hint: "Anna has been looking after everyone. Who is looking after her?"
    feedback_met: "You asked about Anna herself and offered support, without judging her feelings."
    feedback_missed: "Carers of people with HD are under heavy strain. Ask about them and offer support."
    unlocks: H3_anna_coping
    knowledge_card: irritability-and-carers
    source: s36
  - id: C7
    name: Explain guidance on testing Chloe
    met_if: Trainee explains that predictive testing is for adults after counselling, that it will be Chloe's own decision when she turns 18, that she can meet a genetic counsellor to talk about it, and acknowledges Chloe's distress; does not arrange a test now.
    hint_after_turn: 11
    hint: "Chloe is 17 and wants to plan. What is the guidance, and what can she do now?"
    feedback_met: "You explained that predictive testing is an adult choice with counselling, and offered Chloe a way to start."
    feedback_missed: "Predictive testing is generally for adults, after counselling, and is the person's own choice. Offer genetic counselling and support."
    unlocks: H4_chloe_away
    knowledge_card: testing-a-teenager
    source: [s6, s35, s21]
  - id: C8
    name: Document and follow up
    met_if: Trainee documents carefully, summarises the plan, agrees how and when to contact Anna safely, and arranges early follow-up.
    hint_after_turn: 13
    hint: "How will you reach Anna safely, and when will you see her again?"
    feedback_met: "You summarised the plan and agreed safe follow-up."
    feedback_missed: "Document carefully, agree a safe way to contact her, and follow up soon."
    knowledge_card: safety-at-home
    source: s37

red_flags:
  - id: R1
    name: Does not ask about safety
    met_if: Trainee never asks directly whether Anna has been hurt, threatened or is afraid.
    feedback: "Ask directly and kindly about violence and fear."
    source: s37
  - id: R2
    name: Excuses the violence
    met_if: Trainee says Anna must put up with it because 'it's the disease' or 'he can't help it'.
    feedback: "Irritability can be a symptom, but safety comes first. Outbursts can become violent."
    source: s36
  - id: R3
    name: Takes over her decisions
    met_if: Trainee tells Anna she must leave, or says they will call the police, when there is no immediate danger and without her agreement.
    feedback: "Support her choices and make a plan with her, unless there is immediate danger."
    source: s37
  - id: R4
    name: Confronts Mark without her agreement
    met_if: Trainee plans to tell Mark what Anna said, or confront him, without her agreement.
    feedback: "Confronting the person can increase the danger. Agree with her how any information is used."
    source: s37
  - id: R5
    name: Ignores the firearm
    met_if: Trainee does not ask about weapons, or hears the rifle is back and does not address it.
    feedback: "A firearm in the home with escalating aggression and a possible suicidal statement needs action."
    source: [s36, s12]
  - id: R6
    name: Arranges a test for Chloe now
    met_if: Trainee arranges or promises a predictive test for Chloe before she is an adult, or tells Anna she can decide it for Chloe.
    feedback: "Predictive testing is for adults after counselling, and is Chloe's own decision."
    source: [s6, s35]
