# Scenario C4-2: mentor checkpoints (hybrid mentor)
# The AI judge only answers "met / not met" for each checkpoint after each trainee turn.
# All hint and feedback text below is pre-written; the AI never writes its own advice.
# Drafted by: Claude (Anthropic), 2026-10-29. Reviewed by: project owner (checked 2026-10-30)
#
# Sources (Case 4; s36-s39 are new and need human verification).
# Reused, defined elsewhere (not redefined here):
#   s6 (scenarios/s1_pretest_counselling): MacLeod R et al. Recommendations for the predictive genetic test in HD.
#         Clin Genet 2013;83(3):221-31. https://pubmed.ncbi.nlm.nih.gov/22642570/
#   s7 (scenarios/s1_pretest_counselling): Genetic Non-Discrimination Act (Canada, S.C. 2017, c. 3).
#         https://laws-lois.justice.gc.ca/eng/acts/g-2.5/FullText.html
#   s19, s20 (scenarios/A1_disclosing_jhd_diagnosis): HSC What is HD? fact sheet; Baile WF et al. SPIKES.
#         https://hsc.huntingtonsociety.ca/public/factsheet/what-is-hd.pdf  https://pubmed.ncbi.nlm.nih.gov/10964998/
#   s32, s35 (scenarios/B1-B2): BC advance care planning / My Voice guide (includes enduring power of attorney);
#         HSC Physician's Guide chapters 2, 3, 3a and 8.
#         https://www2.gov.bc.ca/assets/gov/people/seniors/health-safety/pdf/myvoiceadvancecareplanningguide.pdf
#         https://hsc.huntingtonsociety.ca/public/resources/physicians-guide.pdf
#   s36 (scenarios/C4-1_recognising_possible_hd): HSC Physician's Guide chapters 1, 5 and 6.
#         https://hsc.huntingtonsociety.ca/public/resources/physicians-guide.pdf
# New:
#   s39 = Government of Canada. Canada Pension Plan disability benefits.
#         https://www.canada.ca/en/services/benefits/publicpensions/cpp/cpp-disability-benefit.html
#         Status: page checked by Claude 2026-10-29; eligibility details need human verification.

hint_timing: Show a checkpoint's hint if it is still not met after `hint_after_turn` trainee turns.

checkpoints:
  - id: C1
    name: Give the result clearly
    met_if: Trainee checks what they expect, gives a brief warning, and states plainly that the test, together with the examination, confirms Huntington disease.
    hint_after_turn: 3
    hint: "Mark expects to be proved right. How will you prepare him, then say it plainly?"
    feedback_met: "You prepared them and gave the diagnosis clearly."
    feedback_missed: "Even when the patient expects good news, give a warning and then a clear statement of the diagnosis."
    knowledge_card: unawareness-in-hd
    source: s20
  - id: C2
    name: Don't argue about insight
    met_if: Trainee acknowledges that Mark sees things differently, does not argue, list his symptoms at him or call it denial, and keeps the conversation going.
    hint_after_turn: 5
    hint: "Mark says he has no symptoms. Will arguing change that?"
    feedback_met: "You accepted that Mark sees it differently, without arguing, and kept him in the conversation."
    feedback_missed: "Unawareness in HD is often a symptom of the illness, not wilful denial. Arguing usually makes it worse."
    knowledge_card: unawareness-in-hd
    source: s36
  - id: C3
    name: Work with the problems Mark accepts
    met_if: Trainee asks about specific day-to-day difficulties (sleep, fatigue, keeping track at work, dropping things) and offers help with those, without requiring him to accept the diagnosis.
    hint_after_turn: 7
    hint: "Is there anything Mark himself finds hard right now?"
    feedback_met: "You found problems Mark does recognise and offered help with them."
    feedback_missed: "Focus on the problems the person can talk about, without repeatedly confronting the diagnosis."
    unlocks: H3_concrete_problems
    knowledge_card: unawareness-in-hd
    source: s36
  - id: C4
    name: Plan for work before a crisis decision
    met_if: Trainee asks how work is going, advises against resigning in a hurry, suggests looking into the employer's disability plan and accommodations, explains that a medical letter can say his difficulties are due to a medical condition (with his consent), mentions CPP Disability, and offers a social worker.
    hint_after_turn: 9
    hint: "Mark is thinking of resigning before he is fired. What could that cost the family?"
    feedback_met: "You opened work planning early and pointed them to the right help."
    feedback_missed: "Losing one's usual job is often the first functional loss in HD. Plan with a social worker before anyone resigns."
    unlocks: H1_suspended
    knowledge_card: work-and-money
    source: [s36, s35, s39]
  - id: C5
    name: Protect finances and plan ahead legally
    met_if: Trainee raises money and impulsive spending respectfully, and suggests planning while Mark can make decisions (for example an enduring power of attorney and a representation agreement), framed as protecting his family and his choices.
    hint_after_turn: 11
    hint: "Impulsivity and unawareness can affect money. What can be put in place while Mark can still decide?"
    feedback_met: "You raised finances and legal planning as protecting Mark and his family."
    feedback_missed: "Unawareness can become dangerous with money; discuss an enduring power of attorney and representation agreement early."
    unlocks: H2_debt
    knowledge_card: work-and-money
    source: [s36, s32]
  - id: C6
    name: What it means for Chloe
    met_if: Trainee explains that Chloe has a 50% chance of having inherited the gene change, that predictive testing is for adults after counselling and would be her own decision, and offers help with how to talk with her.
    hint_after_turn: 12
    hint: "Chloe is already asking. What can Anna tell her honestly?"
    feedback_met: "You explained Chloe's risk honestly, that testing would be her own adult choice, and offered help talking with her."
    feedback_missed: "Explain the 50% chance, that predictive testing is for adults with counselling, and offer help talking with Chloe."
    unlocks: H4_chloe_asking
    knowledge_card: work-and-money
    source: [s19, s6, s35]
  - id: C7
    name: Mention genetic discrimination protections
    met_if: Trainee mentions, where relevant (job, insurance), that Canadian law prohibits requiring genetic test results for contracts or services.
    hint_after_turn: 12
    hint: "Anna is worried about insurance and Chloe's future. What protects them?"
    feedback_met: "You mentioned the Genetic Non-Discrimination Act."
    feedback_missed: "Mention the Genetic Non-Discrimination Act when insurance or employment comes up."
    knowledge_card: work-and-money
    source: s7
  - id: C8
    name: Follow-up, team and safety
    met_if: Trainee arranges early follow-up with the team (social worker, counselling), offers treatment for irritability and sleep, checks mood and safety (including the rifle), and gives contacts.
    hint_after_turn: 14
    hint: "A big diagnosis, a job at risk, irritability and a rifle at home. What needs to happen before the next visit?"
    feedback_met: "You arranged team support and follow-up, and checked safety."
    feedback_missed: "Arrange early follow-up and team support, and check mood and safety, including firearms."
    knowledge_card: unawareness-in-hd
    source: [s36, s35]

red_flags:
  - id: R1
    name: Argues or insists on acceptance
    met_if: Trainee argues with Mark, lists his symptoms to prove the diagnosis, or insists he must accept it.
    feedback: "Insight may not be achievable; focus on the problems he can talk about."
    source: s36
  - id: R2
    name: Calls it denial or a psychological problem
    met_if: Trainee tells Mark he is 'in denial' or implies his lack of awareness is wilful.
    feedback: "Unawareness in HD is thought to be organic ('organic denial'), not a choice."
    source: s36
  - id: R3
    name: Tells him to resign or inform his employer at once
    met_if: Trainee tells Mark to quit his job, or to tell his employer about the diagnosis immediately, without planning.
    feedback: "Work decisions should be planned with a social worker and the employer's disability plan in mind."
    source: s36
  - id: R4
    name: Skips work and money altogether
    met_if: Trainee ends the visit without raising work, finances or legal planning.
    feedback: "Work and money problems are common early in HD; planning early protects the family."
    source: [s36, s35]
  - id: R5
    name: Talks about Mark, not with him
    met_if: Trainee mainly discusses Mark with Anna in the third person while he is present.
    feedback: "Speak with Mark directly; he is the patient and still makes his own decisions."
    source: s36
  - id: R6
    name: Suggests testing Chloe now
    met_if: Trainee suggests Chloe should be tested now, at 17, or that Mark and Anna can decide this for her.
    feedback: "Predictive testing is for adults after counselling, and is the person's own decision."
    source: [s6, s35]
