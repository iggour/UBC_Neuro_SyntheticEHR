probes:
- id: E-H1_wedding_children-1
  target: H1_wedding_children
  speaker: Leah
  steps:
  - Hello Leah. Thanks for coming in today.
  - Before we start, how have things been for you lately?
  - Can you tell me more about why you want the test today?
  disclose_when: Trainee asks an open question about her reasons or about why now (e.g. "What made you decide to
    come now?").
